<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音频转文字</title>
  <meta name="description" content="上传录音，自动转写成文字，可下载 TXT 文本和 SRT、VTT 字幕。免费使用。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>音频转文字</h1>
      <p class="lede">上传一段录音，几分钟内拿到文字稿和字幕文件。免费使用，音频只用于本次转写。</p>
    </header>

    <section class="tape" aria-label="音频">
      <label class="drop" id="drop">
        <input type="file" id="file" class="sr-only" accept="audio/*,video/mp4,video/webm,.m4a,.mp3,.wav,.ogg,.flac,.aac,.opus">
        <canvas id="wave" aria-hidden="true"></canvas>
        <span class="drop-hint" id="dropHint">
          <strong>选择音频文件</strong>，或拖到这里<br>
          <small>支持 MP3、M4A、WAV、OGG、FLAC、MP4 等，最大 50 MB</small>
        </span>
      </label>
      <div class="meta" id="meta" hidden>
        <span id="fileName"></span>
        <span id="fileInfo"></span>
      </div>
    </section>

    <section class="controls">
      <label class="field">
        <span>音频语言</span>
        <select id="language">
          <option value="">自动识别</option>
          <option value="zh" selected>普通话</option>
          <option value="yue">粤语</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
          <option value="fr">法语</option>
          <option value="de">德语</option>
          <option value="es">西班牙语</option>
          <option value="ru">俄语</option>
        </select>
      </label>
      <button id="start" class="primary" disabled>开始转写</button>
      <button id="cancel" class="quiet" hidden>停止</button>
    </section>

    <div id="captcha" class="captcha"></div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="result" id="result" hidden>
      <div class="result-head">
        <h2>文字稿</h2>
        <div class="actions">
          <button id="copy" class="quiet">复制</button>
          <button id="dlTxt">下载 TXT</button>
          <button id="dlSrt">下载 SRT</button>
          <button id="dlVtt">下载 VTT</button>
        </div>
      </div>
      <textarea id="text" spellcheck="false" aria-label="转写结果，可直接修改"></textarea>
      <p class="hint">可以直接在上面修改文字；字幕文件使用转写时的原始分段。</p>
    </section>
  </main>

  <footer>
    识别模型：OpenAI Whisper large-v3-turbo，由 Cloudflare Workers AI 和 Hugging Face 提供算力。
  </footer>

  <script id="turnstileScript" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
